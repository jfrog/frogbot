name: "Frogbot by JFrog"
description: "JFrog Frogbot is a Git bot that scans your pull requests and repositories for security vulnerabilities."
author: "JFrog"
inputs:
  command:
    description: "Frogbot command to run. Set to auto-pr to fix a known vulnerable dependency."
    required: false
  component-name:
    description: "Dependency to fix when command is auto-pr."
    required: false
  affected-version:
    description: "Currently installed vulnerable version when command is auto-pr."
    required: false
  fix-version:
    description: "Version to upgrade to when command is auto-pr."
    required: false
  branch-name:
    description: "Branch to base the fix PR on when command is auto-pr."
    required: false
  commit-hash:
    description: "Exact commit the vulnerability was detected in."
    required: false
  version:
    description: "Frogbot version. The downloaded binary is checked against Artifactory checksums. Set FROGBOT_INSECURE_SKIP_CHECKSUM_VERIFICATION to 1 to skip that check."
    default: "latest"
    required: false
  oidc-provider-name:
    description: "Provider Name's value that was set in OpenId Connect integration in the JFrog platform."
    required: false
  oidc-audience:
    description: "By default, this is the URL of the GitHub repository owner, such as the organization that owns the repository."
    required: false
runs:
  using: "node24"
  main: "action/lib/main.js"
branding:
  icon: "terminal"
  color: "green"
